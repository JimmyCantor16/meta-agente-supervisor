server {
    listen 80;

    # En producción, Nginx hace de proxy hacia el backend (en dev lo hace Vite).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # La generación iterativa hace una llamada al LLM por archivo (más los
        # pases de verificación y reparación), así que puede tardar bastante.
        # Con 600s se cortaba con un 504 mientras el backend seguía trabajando.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 75s;
    }

    # SPA: sirve el index para cualquier ruta no encontrada.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
