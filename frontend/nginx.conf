server {
    listen 80;

    # En producción, Nginx hace de proxy hacia el backend (en dev lo hace Vite).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # La generación iterativa hace varias llamadas al LLM; timeouts amplios.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA: sirve el index para cualquier ruta no encontrada.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}
