# Blueprint de Render: despliega toda la infraestructura del Meta-Agente.
#
# Cómo usarlo:
#   1. Sube este archivo al repositorio (raíz).
#   2. En https://dashboard.render.com/ -> New + -> Blueprint -> elige el repo.
#   3. Render lee este archivo y crea los 3 recursos de golpe.
#   4. Rellena en el dashboard las variables marcadas con `sync: false`
#      (son secretos: NUNCA se versionan aquí).
#
# IMPORTANTE tras el primer deploy:
#   - Confirma la URL real del backend y ajústala en el `rewrite` de abajo si
#     Render le añadió un sufijo al nombre.
#   - Añade la URL del frontend a los orígenes autorizados de Google OAuth.
#
# OJO — ESTE ARCHIVO NO MANDA SOBRE EL SERVICIO VIVO (agosto 2026).
# Los servicios en producción NO están gestionados por blueprint: se crearon a
# mano y Render no los sincroniza con este archivo. Editar aquí una variable,
# una cabecera o una ruta NO cambia nada en producción — hay que aplicarlo por
# el panel de Render o por su API. Este archivo vale como documentación fiel de
# lo que corre y como receta para recrear la infraestructura desde cero; si
# cambias algo aquí, cámbialo TAMBIÉN en el servicio real (y al revés).

# OJO (agosto 2026): la base declarada aquí abajo NO existe hoy en la cuenta
# (la de plan free caduca a los 30 días). Mientras no se recree, `DATABASE_URL`
# llega vacía al backend, `uses_postgres` es False y la persistencia entera
# recae en el SQLite de `DB_PATH`, que ya apunta al disco persistente.
databases:
  # Base de datos PostgreSQL: sustituye al archivo SQLite local, porque el
  # disco de los servicios de Render es efímero y se borra en cada deploy.
  - name: metaagente-db
    databaseName: metaagente
    user: metaagente
    plan: free

services:
  # --- Backend: FastAPI (arquitectura hexagonal) sobre Docker ---
  - type: web
    name: metaagente-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /docs
    # Disco persistente para los proyectos generados.
    #
    # Sin esto, `generated/` vive en el contenedor y se borra en CADA deploy y
    # en cada reinicio: el MVP que el usuario acaba de recibir desaparece, y su
    # URL de vista previa pasa a responder «este sistema no está encendido».
    # Es la diferencia entre entregar un enlace y entregar un enlace que dura.
    disk:
      name: metaagente-generated
      mountPath: /app/generated
      sizeGB: 1
    envVars:
      # Render inyecta la cadena de conexión: al existir DATABASE_URL, la app
      # usa automáticamente los adaptadores PostgreSQL en vez de los SQLite.
      - key: DATABASE_URL
        fromDatabase:
          name: metaagente-db
          property: connectionString
      # Dónde vive el SQLite cuando NO hay PostgreSQL (hoy: la base free del
      # blueprint no existe, así que `uses_postgres` es False y TODO —usuarios,
      # licencias, cupos, cursos, progreso, despliegues, trabajos y actividad—
      # cae en este archivo).
      #
      # `/app/generated` es el ÚNICO punto de montaje del disco persistente (ver
      # `disk` arriba). El valor por defecto de `db_path` resuelve a
      # `/app/evaluations.db`, que está FUERA del disco: se borraba entero en
      # cada deploy y en cada reinicio, y el usuario volvía a encontrarse sin
      # cuenta ni licencia. Con esta ruta, la base sobrevive a ambos.
      #
      # Va como archivo suelto en la raíz del disco, no en una subcarpeta, a
      # propósito: la galería de proyectos y la bandeja de entregas enumeran
      # `generated/` filtrando por `is_dir()`, así que un ARCHIVO (y sus
      # `-wal`/`-shm`) es invisible para ellas, mientras que una subcarpeta
      # aparecería como si fuera un proyecto más del usuario.
      - key: DB_PATH
        value: /app/generated/metaagente.db
      # Redis interno ya existente (caché / estado compartido).
      # Valor: redis://red-d9e08hjtqb8s739ifllg:6379
      - key: REDIS_URL
        sync: false
      # --- Secretos: se rellenan a mano en el dashboard ---
      - key: LLM_PROVIDERS       # cadena JSON de proveedores gratuitos
        sync: false
      - key: DEEPSEEK_API_KEY    # clave del proveedor por defecto
        sync: false
      - key: DEEPSEEK_BASE_URL
        sync: false
      - key: DEEPSEEK_MODEL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SUPER_ADMIN_EMAILS
        sync: false
      # Origen del frontend para CORS. Ajusta al dominio real tras el deploy.
      - key: CORS_ORIGINS
        sync: false
      # URL pública del propio backend. Con ella, los MVP se entregan como
      # <base>/preview/<slug>/ en vez de un localhost inalcanzable.
      - key: PUBLIC_BASE_URL
        sync: false
      # Respaldo de las entregas a GitHub. Con disco persistente ya no es
      # imprescindible, pero sigue siendo la red de seguridad si se recrea el
      # servicio: sin él, las ramas `agente/<slug>` solo viven en ese disco.
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      # Publicación automática de los MVP: con esta clave el agente crea el
      # repo y el web service de cada proyecto (Account Settings → API Keys).
      # Sin ella, POST /publicar responde 503 con instrucciones claras.
      - key: RENDER_API_KEY
        sync: false
      # --- Ajustes no secretos ---
      - key: USE_MOCK_LLM
        value: "false"
      # Aviso de actualización de la app de escritorio. El frontend compara la
      # versión HORNEADA en el instalador con esta y, si hay una más nueva Y una
      # URL de descarga, enseña el aviso. Estaban puestas a mano en el dashboard:
      # declararlas aquí evita que el blueprint mienta sobre lo que corre.
      # Debe ir SIEMPRE igual a la del instalador publicado
      # (`desktop/src-tauri/tauri.conf.json`); si se adelanta, el aviso sale
      # para una descarga que todavía no existe.
      - key: VERSION_ESCRITORIO
        value: "1.1.0"
      # La URL cambia con cada instalador publicado (y a veces es un enlace
      # privado), así que se rellena en el dashboard, no aquí.
      - key: URL_DESCARGA_ESCRITORIO
        sync: false
      - key: FREE_GENERATION_LIMIT
        value: "3"
      - key: FREE_LESSON_LIMIT
        value: "3"
      - key: LOG_LEVEL
        value: INFO

  # --- Frontend: React + Vite, servido como sitio estático ---
  - type: web
    name: metaagente-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # Cabeceras de respuesta del sitio estático.
    #
    # El frontend es una PWA instalable y Chrome IGNORA el manifest si no llega
    # con `Content-Type: application/manifest+json` (Render lo serviría como
    # texto/octet-stream por la extensión .webmanifest, y la instalación deja
    # de ofrecerse sin decir por qué).
    #
    # OJO: en el sitio VIVO esta cabecera está puesta POR LA API de Render, no
    # por este archivo (ver el aviso de arriba: el servicio no está gestionado
    # por blueprint). Se declara aquí para que el blueprint no mienta y para que
    # una recreación desde cero salga ya instalable.
    headers:
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
    routes:
      # Equivale al `proxy_pass` de Nginx en Docker: el frontend sigue llamando
      # a rutas relativas /api/... y Render las reenvía al backend.
      - type: rewrite
        source: /api/*
        destination: https://metaagente-backend.onrender.com/api/*
      # SPA: cualquier otra ruta devuelve el index para que enrute React.
      - type: rewrite
        source: /*
        destination: /index.html
